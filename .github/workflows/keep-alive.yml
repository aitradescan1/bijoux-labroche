name: Keep Supabase Actif

on:
  schedule:
    # Toutes les 48h — 10h00 UTC les jours impairs
    - cron: '0 10 */2 * *'
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  ping:
    name: Ping API → Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M UTC')"
          URL="https://bijoux-labroche.vercel.app/api/ping"
          # 3 tentatives espacées de 30s pour absorber un réveil lent de Supabase
          for i in 1 2 3; do
            RESP=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$URL")
            echo "Tentative $i — statut HTTP : $RESP"
            if [ "$RESP" = "200" ]; then
              echo "✅ Supabase actif"
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "❌ Ping échoué après 3 tentatives (dernier statut : $RESP)"
          exit 1
