name: Keep Supabase Actif

on:
  schedule:
    # Toutes les 48h — 10h00 UTC les jours impairs
    - cron: '0 10 */2 * *'
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  ping:
    name: Ping API → Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M UTC')"
          RESP=$(curl -s -o /dev/null -w "%{http_code}" \
            https://bijoux-labroche-aitradescan1s-projects.vercel.app/api/ping)
          echo "Statut HTTP : $RESP"
          if [ "$RESP" = "200" ]; then
            echo "✅ Supabase actif"
          else
            echo "❌ Réponse inattendue : $RESP"
            exit 1
          fi
